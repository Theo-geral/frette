<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frette</title>
<meta name="description" content="Apprendre la guitare : accordeur, notes, accords et morceaux, avec écoute par le micro.">
<meta name="theme-color" content="#1a120f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect x="2" y="4" width="28" height="24" rx="5" fill="#33241d"/>
      <path d="M2 9.5h28M2 13.5h28M2 17.5h28M2 21.5h28" stroke="#e3ad4f" stroke-width="1.4"/>
      <path d="M11 4v24M21 4v24" stroke="#8d7a6a" stroke-width="1.6"/>
      <circle cx="16" cy="15.5" r="2.6" fill="#f4eadf"/>
    </svg>
    Frette
  </div>
  <button id="micBtn" class="mic off" data-act="mic" type="button">
    <span class="level"><i id="levelBar"></i></span>
    <span id="micLabel">Activer le micro</span>
  </button>
</header>

<main id="main">
  <section id="view-tuner" class="view" hidden></section>
  <section id="view-notes" class="view" hidden></section>
  <section id="view-chords" class="view" hidden></section>
  <section id="view-songs" class="view" hidden></section>
</main>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button type="button" role="tab" data-tab="tuner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l3.5-5"/><path d="M12 9v1M7 11.5l.7.7M17 11.5l-.7.7"/></svg>
    Accorder
  </button>
  <button type="button" role="tab" data-tab="notes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="17" r="3"/><path d="M11 17V4l8 2.5"/></svg>
    Notes
  </button>
  <button type="button" role="tab" data-tab="chords">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 8h14M9.7 3v18M14.3 3v18"/><circle cx="12" cy="10.8" r="1.4" fill="currentColor" stroke="none"/><circle cx="16.6" cy="15.5" r="1.4" fill="currentColor" stroke="none"/></svg>
    Accords
  </button>
  <button type="button" role="tab" data-tab="songs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18" opacity=".45"/><circle cx="8" cy="12" r="2.2" fill="currentColor" stroke="none"/><circle cx="15" cy="7" r="2.2" fill="currentColor" stroke="none"/><circle cx="19" cy="17" r="2.2" fill="currentColor" stroke="none"/></svg>
    Morceaux
  </button>
</nav>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
